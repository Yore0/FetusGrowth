[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-perinatal-outcome-vlm"
version = "0.1.0"
description = "Leakage-safe temporal VLM regression for perinatal outcomes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
train = [
  "torch>=2.6",
  "transformers>=5.0",
  "peft>=0.19",
]
analysis = [
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pillow>=10",
]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
